# Local runtime. Expects paw-web checked out as a sibling directory (../paw-web).
# All values here are nonsecret local defaults; real environments inject credentials at runtime.
name: paw

x-api-env: &api-env
  PAW_ENV: local
  PAW_DATABASE_URL: postgresql://paw:paw_local_only@db:5432/paw
  PAW_LOG_LEVEL: INFO
  PAW_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paw
      POSTGRES_PASSWORD: paw_local_only
      POSTGRES_DB: paw
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paw -d paw"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    restart: "no"

  api:
    build: .
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "paw_server.worker"]
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend]

  web:
    build:
      context: ../paw-web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    networks: [frontend]

networks:
  backend:
    internal: true   # db and worker have no route out or in
  frontend: {}

volumes:
  pgdata: {}
