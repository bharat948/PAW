[project]
name = "paw-server"
version = "0.1.0"
description = "PAW API and ingestion worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-json-logger>=2.0",
  "python-multipart>=0.0.32",
  "boto3>=1.43.121",
  "pypdf>=6.21.4",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paw_server"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real PostgreSQL (PAW_TEST_DATABASE_URL)",
  "live: calls a real embedding provider (PAW_EMBEDDING_API_KEY); costs money, never run in CI by default",
]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
