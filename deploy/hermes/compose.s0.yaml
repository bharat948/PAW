# Spike S0 only: one Hermes container for the contract tests. NOT the production topology (see PAW-002 spec 7.2).
#   docker compose --env-file /path/outside/repo/s0.env -f deploy/hermes/compose.s0.yaml up -d
# Secrets come from the env file, never the image. The API is published on loopback only.
# No named volume on HERMES_HOME: the install lives inside it, and recreating the container is the "state wiped" test.
name: paw-hermes-s0
services:
  hermes:
    image: paw-hermes:s0
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:?set API_SERVER_KEY (>= 32 random chars)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      HERMES_CONFIG_SET: ${HERMES_CONFIG_SET:-}
      PAW_MCP_URL: ${PAW_MCP_URL:-}
      PAW_MCP_TOKEN: ${STUB_TOKEN:-}
      PAW_MCP_TRUST: ${PAW_MCP_TRUST:-full}
      PAW_MCP_INCLUDE: ${PAW_MCP_INCLUDE:-}
      PAW_HERMES_LOCKDOWN: ${PAW_HERMES_LOCKDOWN:-1}
      PAW_HERMES_GUARD: ${PAW_HERMES_GUARD:-1}
      PAW_GUARD_MODE: ${PAW_GUARD_MODE:-block}
    ports: ["127.0.0.1:8642:8642"]
    restart: "no"

  # S0 only: stub MCP server in the same image (same MCP SDK as the client). Real gateway is 002D.
  stub-mcp:
    image: paw-hermes:s0
    entrypoint: ["bash", "-c", "exec $$(ls -d $$HERMES_HOME/installs/*/environments/*/venv/bin/python | head -1) /stub/stub_mcp_server.py"]
    environment:
      STUB_TOKEN: ${STUB_TOKEN:?set STUB_TOKEN}
    volumes:
      - ../../paw-server/tests/contract/hermes/stub_mcp_server.py:/stub/stub_mcp_server.py:ro
    ports: ["127.0.0.1:8001:8001"]
    restart: "no"
