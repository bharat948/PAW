# Same-origin front door: built SPA at /, explicitly allowed API routes under /api.
# The prefix is stripped exactly once here; FastAPI keeps serving /v1/... and /ready.
# Not routed on purpose: /docs, /openapi.json, anything internal.
server {
  listen 8080;
  root /usr/share/nginx/html;

  client_max_body_size 12m;   # PAW_MAX_UPLOAD_BYTES default is 10 MiB, plus multipart overhead

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/v1/ {
    proxy_pass http://api:8000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;          # server-sent events (chat) must not be buffered
    proxy_request_buffering off;  # stream uploads through
    proxy_read_timeout 300s;
  }

  location = /api/health { proxy_pass http://api:8000/health; }
  location = /api/ready  { proxy_pass http://api:8000/ready; }

  # unknown API paths are a 404, never the SPA's index.html
  location /api/ { return 404; }

  location / { try_files $uri /index.html; }
}
