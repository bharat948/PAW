name: web-ci
on:
  pull_request:
    paths: ['paw-web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['paw-web/**', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: paw-web
    steps:
      # TODO(pin): replace tags with full commit SHAs before 001D (R02 requires pinned actions).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: paw-web/.nvmrc
          cache: npm
          cache-dependency-path: paw-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: docker build -t paw-web:ci .
